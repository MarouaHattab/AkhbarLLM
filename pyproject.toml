[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "news-finetuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
distillation = [
    "openai>=1.61,<2",
    "tqdm>=4.67,<5",
]
evaluation = [
    "accelerate>=1.2.1,<2",
    "google-api-core>=2.34,<3,!=2.35.0",
    "google-genai>=1.0,<2",
    "huggingface-hub>=0.36.0,<2",
    "openai>=1.61,<2",
    "torch>=2.5.1",
    "transformers==4.48.3",
]
serve = [
    "vllm==0.7.2 ; sys_platform == 'linux'",
]
train = [
    "datasets==3.2.0",
    "faker==35.2.0",
    "huggingface-hub>=0.36.0,<2",
    "json-repair==0.29.1",
    "openai==1.61.0",
    "optimum==1.24.0",
    "transformers==4.48.3",
    "wandb>=0.28.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
