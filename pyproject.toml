[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "news-finetuning"
version = "0.1.0"
description = "Arabic news distillation, Qwen LoRA fine-tuning, evaluation, and local vLLM serving."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
app = [
    "accelerate>=1.2.1,<2",
    "huggingface-hub>=0.36.0,<2",
    "openai>=1.61,<2",
    "peft==0.18.1",
    "streamlit>=1.42,<2",
    "torch>=2.5.1",
    "transformers==4.48.3",
]
distillation = [
    "openai>=1.61,<2",
    "tqdm>=4.67,<5",
]
evaluation = [
    "accelerate>=1.2.1,<2",
    "faker==35.2.0",
    "google-api-core>=2.34,<3,!=2.35.0",
    "google-genai>=1.0,<2",
    "huggingface-hub>=0.36.0,<2",
    "openai>=1.61,<2",
    "peft==0.18.1",
    "torch>=2.5.1",
    "tqdm>=4.67,<5",
    "transformers==4.48.3",
]
serve = [
    "faker==35.2.0",
    "locust>=2.32,<3",
    "openai>=1.61,<2",
    "transformers==4.48.3",
    "vllm==0.7.2 ; sys_platform == 'linux'",
]
test = [
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "pytest>=8.3,<9",
    "starlette>=0.41,<1",
]
train = [
    "datasets==3.2.0",
    "faker==35.2.0",
    "huggingface-hub>=0.36.0,<2",
    "json-repair==0.29.1",
    "openai==1.61.0",
    "optimum==1.24.0",
    "transformers==4.48.3",
    "wandb>=0.28.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Avoid the Windows-locked `.pytest_cache/v` path from earlier runs.
cache_dir = ".cache/pytest"
testpaths = ["tests"]
